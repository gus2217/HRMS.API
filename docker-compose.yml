version: "3.9"

# Jacana HRMS — local development infrastructure.
# Redis (distributed cache) + OTLP collector (traces).
# Postgres is NOT included: the project uses an external Postgres server
# (set DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASS — see dev.sh).
# Hangfire runs in-process in the API (AddHangfireServer) and uses Postgres for
# storage, so it needs no separate container here.

services:
  redis:
    image: redis:7-alpine
    container_name: jacana-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - jacana_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # OpenTelemetry collector (traces) — optional; remove if not tracing locally.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: jacana-otel
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

volumes:
  jacana_redisdata:
